<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ONSIS XML Error Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #logo {
            max-width: 300px;
            margin-bottom: 20px;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <img id="logo" src="logo.jpg" alt="OCSB">

    <h2>ONSIS XML Error Viewer</h2>

    <input type="file" id="xmlFile" accept=".xml">

    <div id="result"></div>

    <!-- JavaScript XSLT processor -->
    <script src="https://cdn.jsdelivr.net/npm/@tradik/xslt-processor@1/dist/xslt-processor.browser.min.js"></script>

    <script>
        document.getElementById('xmlFile').addEventListener('change', processXML);

        async function processXML(event) {

            var file = event.target.files[0];

            if (!file) {
                return;
            }

            try {

                // Read the XML file as UTF-8.
                // This preserves French accented characters such as é.
                var xmlContent = await file.text();

                // Parse XML
                var parser = new DOMParser();

                var xmlDocument = parser.parseFromString(
                    xmlContent,
                    'application/xml'
                );

                // Check whether XML parsing failed
                var parserError =
                    xmlDocument.getElementsByTagName('parsererror');

                if (parserError.length > 0) {
                    alert(
                        'Unable to process the XML file. ' +
                        'The selected XML file could not be parsed.'
                    );
                    return;
                }

                // Load the XSLT file
                var response = await fetch('style_format.xsl');

                if (!response.ok) {
                    throw new Error(
                        'Unable to load style_format.xsl'
                    );
                }

                var xslContent = await response.text();

                // Parse XSLT
                var xslDocument = parser.parseFromString(
                    xslContent,
                    'application/xml'
                );

                var xslParserError =
                    xslDocument.getElementsByTagName('parsererror');

                if (xslParserError.length > 0) {
                    throw new Error(
                        'style_format.xsl could not be parsed.'
                    );
                }

                // Use JavaScript XSLT processor
                var xsltProcessor =
                    new XsltProcessorLib.XSLTProcessor();

                xsltProcessor.importStylesheet(xslDocument);

                // Transform XML
                var transformedContent =
                    xsltProcessor.transformToDocument(xmlDocument);

                // Get the BODY from the transformed document
                var body =
                    transformedContent.getElementsByTagName('BODY')[0];

                if (!body) {
                    body =
                        transformedContent.getElementsByTagName('body')[0];
                }

                if (body) {
                    document.getElementById('result').innerHTML =
                        body.innerHTML;
                } else {
                    document.getElementById('result').innerHTML =
                        new XMLSerializer()
                            .serializeToString(transformedContent);
                }

            } catch (error) {

                console.error(error);

                alert(
                    'Unable to process the XML file.\n\n' +
                    'Error: ' + error.message
                );
            }
        }
    </script>

</body>
</html>
